[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "density-aware-partitioning-repro"
version = "0.1.0"
description = "Minimal reproducibility code for Density-Aware Partitioning (DAP) example figures (Figures 3–6)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]