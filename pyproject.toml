[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "density-aware-forests"
version = "0.2.0"
description = "WIF, WRCF and drop-in density-aware partitioning for anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "docs/licenses/*.txt"]
authors = [{name = "Sijin Yeom"}, {name = "Jae-Hun Jung"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.4"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "build>=1", "ruff>=0.9", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/yeomsijin/WIF-WRCF-DAP"
"Drop-in paper" = "https://doi.org/10.1088/2632-2153/ae5390"
"Weighted paper" = "https://doi.org/10.1007/s11634-026-00688-3"

[tool.setuptools.packages.find]
where = ["."]
include = ["density_aware_forests*", "dap*", "wif*", "wrcf*", "src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"wrcf/wrcf.py" = ["E741"]
